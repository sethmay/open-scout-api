name: Build & Deploy API

# Validate + build on every push/PR (non-vacuous gate); deploy to GitHub Pages only on main.
# One-time setup: repo Settings -> Pages -> Source = GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema[format]"   # format extra so uri/date/date-time checks bite
      - name: Validate (gate — fails the run on any error)
        run: |
          python tools/validate_examples.py
          python tools/validate_data.py
          python tools/check_links.py
      - name: Build static API
        # build_sqlite.py runs here too, not just in the cookbook job, so the queryable artifact
        # is actually served at v1/open-scout-api.sqlite. docs/endpoints.md documents that URL, and
        # without this step it 404s -- a documented endpoint that only ever existed in a Release.
        run: |
          python tools/build.py
          python tools/build_sqlite.py
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Deploy only from main, and only after the build+validate gate passes.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cookbook:
    # The examples are gated exactly like the data: each recipe asserts its own invariants and
    # exits nonzero when they break, so a schema or projection change that invalidates an
    # example fails here instead of shipping a snippet that teaches the wrong thing.
    #
    # Deliberately NOT a dependency of `deploy`: a broken example must not hold a data
    # correction hostage. It still fails the PR and reddens main, which is the point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cookbook/ts/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: pip install "jsonschema[format]"
      - name: Build the API the recipes run against
        run: |
          python tools/build.py
          python tools/build_sqlite.py
      - name: Generated consumer types match the schemas
        run: python tools/gen_types.py --check
      - name: Cookbook gate (Python, SQL, shell, TypeScript, C#)
        # --strict: a suite that skips because its toolchain vanished from the image is a
        # failure, not a pass. Without it a missing jq or node would mean zero coverage, green.
        run: python tools/validate_cookbook.py --strict
